[package]
name = "grusindeks-web"
version.workspace = true
edition.workspace = true
# sqlx 0.9 (and Leptos 0.8) need a newer toolchain than the reusable crates'
# 1.80 floor. Pinned per-package so grusindeks-core/-met/-cli keep their
# conservative MSRV.
rust-version = "1.94"
license.workspace = true
authors.workspace = true
description = "Web GUI for grusindeks — Leptos SSR + Axum, reusing the core scoring crates"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure, wasm-friendly domain + serializable response types. Available to BOTH
# the server build and the wasm client build (the client deserializes the
# server-fn responses), so it must NOT be feature-gated.
grusindeks-core = { workspace = true }

leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# All user-facing times render in Norway's zone (fixed, not the server's TZ) so
# SSR and wasm hydration agree and a UTC container shows correct local times.
chrono-tz = "0.10"

# Client (wasm) only.
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# DayCard reads its own bounding box to anchor the hourly popup; the call is
# compiled in both builds (the handler just never fires under SSR). `Element` /
# `HtmlElement` come from leptos's web-sys, but `get_bounding_client_rect` needs
# the DomRect features explicitly. Feature-unifies with leptos's web-sys.
web-sys = { version = "0.3", features = ["DomRect", "DomRectReadOnly"] }

# Server (ssr) only: orchestration, HTTP clients, the web server.
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-full"], optional = true }
grusindeks-cli = { workspace = true, default-features = false, optional = true }
grusindeks-met = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate", "chrono"], optional = true }
arc-swap = { version = "1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[features]
# Plain `cargo build/test` (and rust-analyzer) build the native server. The
# wasm build is driven by cargo-leptos, which passes `--no-default-features
# --features=hydrate`, so this default never reaches the client bundle.
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:grusindeks-cli",
    "dep:grusindeks-met",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:sqlx",
    "dep:arc-swap",
]

[package.metadata.leptos]
output-name = "grusindeks-web"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults and not dead"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
