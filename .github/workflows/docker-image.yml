name: Build container image

# Pushing a version tag (v0.2.0, …) builds and publishes the image with that
# tag, e.g. ghcr.io/<owner>/grusindeks-web:v0.2.0. The manual dispatch stays
# for one-off builds with a free-form tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag to publish
        required: true
        default: web
      image_name:
        description: GHCR image name
        required: true
        default: grusindeks-web

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push linux/arm64 image
    # Build native ARM64. Building this Rust/Leptos image for ARM64 via QEMU on
    # ubuntu-latest is extremely slow and can fail after several hours.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          # Tag pushes have no `inputs`, so the fallbacks pick the image name
          # and use the git tag (github.ref_name) as the container tag.
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name || 'grusindeks-web' }}:${{ inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
