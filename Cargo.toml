[workspace]
resolver = "2"
members = [
    "crates/grusindeks-core",
    "crates/grusindeks-met",
    "crates/grusindeks-cli",
    "crates/grusindeks-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Truls Skare"]

[workspace.dependencies]
grusindeks-core = { path = "crates/grusindeks-core" }
grusindeks-met = { path = "crates/grusindeks-met" }
grusindeks-cli = { path = "crates/grusindeks-cli", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
directories = "6"

# Dev
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "yaml"] }
rstest = "0.26"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = "thin"
strip = true

# Size-optimized profile for the wasm client bundle (selected by cargo-leptos
# via `lib-profile-release` in grusindeks-web's metadata). `wasm-opt` runs on
# top of this; combined with server-side compression the transfer is small.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
