[workspace]
resolver = "2"
members = [
    "crates/grusindeks-core",
    "crates/grusindeks-met",
    "crates/grusindeks-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Truls Skare"]

[workspace.dependencies]
grusindeks-core = { path = "crates/grusindeks-core" }
grusindeks-met = { path = "crates/grusindeks-met" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
directories = "6"

# Dev
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "yaml"] }
rstest = "0.24"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = "thin"
strip = true
